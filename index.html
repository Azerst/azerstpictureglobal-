<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="referrer" content="no-referrer" />
  <title>AZERST — Booyah Pass</title>

  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff2">

  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>

  <div class="bg-glow" aria-hidden="true"><span class="g3"></span></div>

  <main class="page">

    <header class="hero">
      <h1 class="hero-title">AZERST</h1>
      <p class="hero-sub">BOOYAH PASS GALLERY</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Chọn Booyah Pass">
      <button class="tab is-active" data-tab="t1" role="tab" aria-selected="true" aria-controls="panel-t1" type="button">
        <span class="tab-prefix">BOOYAH</span>
        <span class="tab-month">THÁNG 1</span>
      </button>
      <button class="tab" data-tab="t2" role="tab" aria-selected="false" aria-controls="panel-t2" type="button">
        <span class="tab-prefix">BOOYAH</span>
        <span class="tab-month">THÁNG 2</span>
      </button>
      <button class="tab" data-tab="t3" role="tab" aria-selected="false" aria-controls="panel-t3" type="button">
        <span class="tab-prefix">BOOYAH</span>
        <span class="tab-month">THÁNG 3</span>
      </button>
    </div>

    <section class="panel is-active" id="panel-t1" role="tabpanel">
      <header class="panel-title">
        <h2>
          <span class="title-prefix">THẺ BOOYAH</span>
          <span class="title-month">THÁNG 1</span>
        </h2>
      </header>
      <div class="grid" id="grid-t1"></div>
    </section>

    <section class="panel" id="panel-t2" role="tabpanel">
      <header class="panel-title">
        <h2>
          <span class="title-prefix">THẺ BOOYAH</span>
          <span class="title-month">THÁNG 2</span>
        </h2>
      </header>
      <div class="grid" id="grid-t2"></div>
    </section>

    <section class="panel" id="panel-t3" role="tabpanel">
      <header class="panel-title">
        <h2>
          <span class="title-prefix">THẺ BOOYAH</span>
          <span class="title-month">THÁNG 3</span>
        </h2>
      </header>
      <div class="grid" id="grid-t3"></div>
    </section>

    <footer class="page-footer">
      <p class="copy">© 2026 <strong>AZERST</strong> — ALL RIGHTS RESERVED</p>
    </footer>

  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-inner">
      <button class="modal-close" id="modalClose" type="button" aria-label="Đóng">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-brand">
        <span class="modal-brand-name">AZERST</span>
      </div>
      <div class="modal-media" id="modalMedia">
        <img id="modalImg" src="" alt="AZERST" draggable="false" />
        <div class="pending">Đang cập nhật</div>
      </div>
      <div class="modal-footer">
        <button class="modal-dl" id="modalDl" type="button" aria-label="Tải xuống">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M6 11l6 6 6-6M5 21h14"/></svg>
          Tải xuống
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- GUARD OVERLAY — huy hiệu cảnh báo + loading ngang 3s -->
  <div class="guard-overlay" id="guardOverlay" data-type="default" role="alertdialog" aria-modal="true" aria-hidden="true">

    <div class="guard-mesh" aria-hidden="true"></div>

    <div class="guard-card">

      <span class="guard-corner guard-corner-tl" aria-hidden="true"></span>
      <span class="guard-corner guard-corner-tr" aria-hidden="true"></span>
      <span class="guard-corner guard-corner-bl" aria-hidden="true"></span>
      <span class="guard-corner guard-corner-br" aria-hidden="true"></span>

      <div class="guard-stripes guard-stripes-top"    aria-hidden="true"></div>
      <div class="guard-stripes guard-stripes-bottom" aria-hidden="true"></div>

      <!-- Huy hiệu cảnh báo -->
      <div class="guard-badge" role="presentation">
        <span class="guard-badge-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9"  x2="12"    y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </span>
        <span class="guard-badge-text" id="guardErrorCode">ERR 403 // FORBIDDEN ACCESS</span>
        <span class="guard-badge-dot" aria-hidden="true"></span>
      </div>

      <!-- Icon shield -->
      <div class="guard-icon-wrap">
        <span class="guard-halo" aria-hidden="true"></span>
        <div class="guard-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
          </svg>
        </div>
      </div>

      <h2 class="guard-title" id="guardTitle" data-text="TRUY CẬP TRÁI PHÉP">TRUY CẬP TRÁI PHÉP</h2>
      <p class="guard-subtitle" id="guardSubtitle">▸ HỆ THỐNG BẢO VỆ ◂</p>
      <p class="guard-desc" id="guardDesc">Hệ thống đã phát hiện hành vi can thiệp. Vui lòng dừng lại.</p>

      <!-- Countdown ring 3s -->
      <div class="guard-countdown-wrap">
        <svg class="guard-ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="guard-ring-bg"   cx="60" cy="60" r="52"/>
          <circle class="guard-ring-glow" cx="60" cy="60" r="52"/>
          <circle class="guard-ring-fg"   cx="60" cy="60" r="52"/>
        </svg>
        <div class="guard-countdown" id="guardCountdown">3</div>
      </div>

      <!-- Loading ngang 3s -->
      <div class="guard-loading">
        <div class="guard-loading-track">
          <div class="guard-loading-fill">
            <div class="guard-loading-shimmer" aria-hidden="true"></div>
            <span class="guard-loading-marker" aria-hidden="true"></span>
          </div>
        </div>
        <div class="guard-loading-info">
          <span class="guard-loading-label">ĐANG KHÔI PHỤC</span>
          <span class="guard-loading-time"><span id="guardSeconds">3</span>S</span>
        </div>
      </div>

    </div>
  </div>

  <script src="./assets/script.js" defer></script>
  <script src="./assets/guard.js" defer></script>

</body>
</html>

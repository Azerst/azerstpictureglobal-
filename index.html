<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="referrer" content="no-referrer" />
  <title>AZERST — Booyah Pass</title>

  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Black.woff2">

  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>

  <div class="bg-glow" aria-hidden="true"><span class="g3"></span></div>

  <main class="page">

    <header class="hero">
      <h1 class="hero-title">AZERST</h1>
      <p class="hero-sub">BOOYAH PASS GALLERY</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Chọn Booyah Pass">
      <button class="tab is-active" data-tab="t1" role="tab" aria-selected="true" aria-controls="panel-t1" type="button">
        <span class="tab-prefix">BOOYAH</span>
        <span class="tab-month">THÁNG 1</span>
      </button>
      <button class="tab" data-tab="t2" role="tab" aria-selected="false" aria-controls="panel-t2" type="button">
        <span class="tab-prefix">BOOYAH</span>
        <span class="tab-month">THÁNG 2</span>
      </button>
      <button class="tab" data-tab="t3" role="tab" aria-selected="false" aria-controls="panel-t3" type="button">
        <span class="tab-prefix">BOOYAH</span>
        <span class="tab-month">THÁNG 3</span>
      </button>
    </div>

    <section class="panel is-active" id="panel-t1" role="tabpanel">
      <header class="panel-title">
        <h2>
          <span class="title-prefix">THẺ BOOYAH</span>
          <span class="title-month">THÁNG 1</span>
        </h2>
      </header>
      <div class="grid" id="grid-t1"></div>
    </section>

    <section class="panel" id="panel-t2" role="tabpanel">
      <header class="panel-title">
        <h2>
          <span class="title-prefix">THẺ BOOYAH</span>
          <span class="title-month">THÁNG 2</span>
        </h2>
      </header>
      <div class="grid" id="grid-t2"></div>
    </section>

    <section class="panel" id="panel-t3" role="tabpanel">
      <header class="panel-title">
        <h2>
          <span class="title-prefix">THẺ BOOYAH</span>
          <span class="title-month">THÁNG 3</span>
        </h2>
      </header>
      <div class="grid" id="grid-t3"></div>
    </section>

    <footer class="page-footer">
      <p class="copy">© 2026 <strong>AZERST</strong> — ALL RIGHTS RESERVED</p>
    </footer>

  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-inner">
      <button class="modal-close" id="modalClose" type="button" aria-label="Đóng">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-brand">
        <span class="modal-brand-name">AZERST</span>
      </div>
      <div class="modal-media" id="modalMedia">
        <img id="modalImg" src="" alt="AZERST" draggable="false" />
        <div class="pending">Đang cập nhật</div>
      </div>
      <div class="modal-footer">
        <button class="modal-dl" id="modalDl" type="button" aria-label="Tải xuống">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M6 11l6 6 6-6M5 21h14"/></svg>
          Tải xuống
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ============================================================
       GUARD OVERLAY — PHIÊN BẢN MỚI (Cyber Security Style)
       ============================================================ -->
  <div class="guard-overlay" id="guardOverlay" role="alertdialog" aria-modal="true" aria-hidden="true">
    <div class="guard-card">
      <!-- Vạch sọc cảnh báo chạy ngang trên cùng -->
      <div class="guard-stripes" aria-hidden="true"></div>

      <!-- Icon cảnh báo với viền sóng xung kích -->
      <div class="guard-icon-wrap">
        <div class="guard-icon-ring" aria-hidden="true"></div>
        <div class="guard-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
          </svg>
        </div>
      </div>

      <!-- Tiêu đề + mô tả -->
      <h2 class="guard-title">Truy Cập Bị Chặn</h2>
      <p class="guard-subtitle">Phát hiện công cụ DevTools</p>
      <p class="guard-desc">Vui lòng đóng DevTools để tiếp tục. Trang sẽ tự khôi phục sau:</p>

      <!-- Vòng tròn đếm ngược SVG -->
      <div class="guard-countdown-wrap">
        <svg class="guard-ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="guard-ring-bg" cx="60" cy="60" r="52"/>
          <circle class="guard-ring-fg" cx="60" cy="60" r="52"/>
        </svg>
        <div class="guard-countdown" id="guardCountdown">4</div>
      </div>

      <p class="guard-note">Giây • Tự động tải lại</p>

      <!-- Progress bar đáy -->
      <div class="guard-progress" aria-hidden="true">
        <div class="guard-progress-bar"></div>
      </div>
    </div>
  </div>

  <script src="./assets/script.js" defer></script>
  <script src="./assets/guard.js" defer></script>

</body>
</html>
